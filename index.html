<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GACHON WIND — Baseball Club at Gachon University</title>
  <meta name="description" content="The official home of GACHON WIND, Gachon University's student-run baseball club. Practice times, game schedule, gallery and sign-up — in English, Korean, Vietnamese, Japanese and Chinese.">
  <meta name="theme-color" content="#1E509A">
  <meta property="og:title" content="GACHON WIND — Baseball Club">
  <meta property="og:description" content="One home for Gachon's baseball club: schedule, photos and a sign-up form that works.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="static/img/hero-batter.webp">
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <script>
    /* Apply the saved (or system) theme before first paint so the dark
       theme never flashes. main.js keeps this in sync afterwards. */
    (function () {
      try {
        var saved = window.localStorage.getItem("gw-theme");
        var theme = saved === "dark" || saved === "light" ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) { /* private mode — light theme stands */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="GACHON WIND Baseball Club — home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 46 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square">
            <path d="M2 4 L14 16 L2 28"/>
            <path d="M17 4 L29 16 L17 28"/>
            <path d="M32 4 L44 16 L32 28"/>
          </svg>
        </span>
        <span class="brand-type">
          <span class="brand-name">GACHON WIND</span>
          <span class="brand-sub">BASEBALL CLUB</span>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Primary">
        <a href="#club" data-nav data-i18n="nav.club">Club</a>
        <a href="#schedule" data-nav data-i18n="nav.schedule">Schedule</a>
        <a href="#gallery" data-nav data-i18n="nav.gallery">Gallery</a>
        <a href="#join" data-nav data-i18n="nav.join">Join</a>
        <a href="#contact" data-nav data-i18n="nav.contact">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="theme-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
            <circle cx="12" cy="12" r="4.4"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/>
          </svg>
        </button>
        <div class="lang-select lang-select-sm">
          <label class="sr-only" for="lang-header" data-i18n="nav.language">Language</label>
          <select class="lang-select-input" id="lang-header" data-lang-select>
            <option value="en" lang="en">English</option>
            <option value="ko" lang="ko">한국어</option>
            <option value="vi" lang="vi">Tiếng Việt</option>
            <option value="ja" lang="ja">日本語</option>
            <option value="zh" lang="zh">简体中文</option>
          </select>
          <span class="lang-select-chevron" aria-hidden="true"></span>
        </div>
        <a class="btn btn-primary btn-sm header-cta" href="#join" data-i18n="nav.signup">Sign up</a>
        <button class="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu" data-i18n-attr="aria-label:nav.menu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

      <a class="menu-ig" href="https://www.instagram.com/gcu_wind" target="_blank" rel="noopener">@GCU_WIND</a>
    </div>

          </svg>

        <div class="lang-select lang-select-lg">
          <label class="sr-only" for="lang-menu" data-i18n="nav.language">Language</label>
          <select class="lang-select-input" id="lang-menu" data-lang-select>
            <option value="en" lang="en">English</option>
            <option value="ko" lang="ko">한국어</option>
            <option value="vi" lang="vi">Tiếng Việt</option>
            <option value="ja" lang="ja">日本語</option>
            <option value="zh" lang="zh">简体中文</option>
          </select>
          <span class="lang-select-chevron" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>

  <main id="main">
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
